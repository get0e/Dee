<style>

.kiss .glow{animation-duration:1.8s}

.ticket::before{left:-12px}.ticket::after{right:-12px}

.ticket .tag{text-align:center;color:var(--mut);font-style:italic;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px dashed var(--line);font-size:1.15rem}
.row b{color:var(--gold);font-weight:600;white-space:nowrap}.row span{text-align:right;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid #fff5}
.stamp{text-align:center;margin-top:12px;color:var(--mut);font-size:.95rem;letter-spacing:.15em;text-transform:uppercase}
.share{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.share .btn,.share button{text-align:center;font-size:1.1rem}
.alt{background:transparent!important;color:var(--gold2)!important;border:1px solid var(--line)!important;box-shadow:none!important}

for(let i=0;i<300;i++){const x=-350+R()*1100,y=520+R()*191,r=3+R()*4.5,c=P[Math.floor(R()*8)],h=10+R()*18;

function bake(id,defs){const old=$(id),el=old.cloneNode(true);el.setAttribute('xmlns','http://www.w3.org/2000/svg');el.setAttribute('viewBox','-700 -60 1800 831');el.setAttribute('width',1800);el.setAttribute('height',831);el.setAttribute('preserveAspectRatio','none');['class','id','style'].forEach(a=>el.removeAttribute(a));

let AC,master,bus,SON=false,step=0,mi=2,timer;
const N=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[48,52,55,59],[45,48,52,55],[41,45,48,52],[43,47,50,53]],SC=[67,69,72,74,76,79,81];
function note(m,t,v,d){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();o.type='sine';o2.type='triangle';o.frequency.value=N(m);o2.frequency.value=N(m)*1.003;g2.gain.value=.22;o2.connect(g2);g2.connect(g);o.connect(g);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+d);g.connect(bus);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)}
function tickMusic(){const t=AC.currentTime+.06,bar=Math.floor(step/8)%4,k=step%8,c=PROG[bar];
if(k==0){note(c[0]-12,t,.2,3.6);note(c[0],t,.1,3.2)}
if(k==4)note(c[1]-12,t,.09,2.4);

if([0,3,6].includes(k)&&Math.random()<.7){mi=Math.max(0,Math.min(SC.length-1,mi+[-1,0,1,1,-1,2,-2][Math.floor(Math.random()*7)]));note(SC[mi]+(bar==2&&k==0?-12+12:0),t+.01,.11,2.6)}
step++}
function sound(on){SON=on;$('#snd').textContent=on?'Sound on':'Sound off';

const dl=AC.createDelay(1.5);dl.delayTime.value=.46;const fb=AC.createGain();fb.gain.value=.4;const dg=AC.createGain();dg.gain.value=.45;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(dg);dg.connect(master)}
AC.resume();master.gain.setTargetAtTime(.9,AC.currentTime,.8);clearInterval(timer);timer=setInterval(tickMusic,455)}
else if(AC){master.gain.setTargetAtTime(0,AC.currentTime,.5);clearInterval(timer)}}

{k:"Feels cared for when",t:"What makes you feel truly cared for?",o:["Undivided attention","Kind words","Little surprises","Warm hugs","Being understood"]},
{k:"Favourite food",t:"What are you in the mood to eat?",o:["Pizza","Pasta","Sushi","Burgers","Desserts only","Street food"],txt:"Something else…"},
{k:"Favourite colour",t:"Which colour is you? I'll try to match it.",sw:["#e84a6b","#8e5bd0","#3a9bd9","#2fb67c","#f6c343","#ff8a3d","#fff6dc","#1b1409"],names:["Rose","Violet","Sky","Emerald","Gold","Sunset","Ivory","Midnight"]},
{k:"Unforgettable if",t:"What would make this evening unforgettable for you?",txt:"Be honest, I want to get it right…",free:true},
{k:"A message for me",t:"Is there anything you'd like me to know before we meet?",txt:"Write me a few words…",free:true}
];
const A={};

function chest(){
show(`<div class="q"><div class="eb">The vault is open</div><h2 style="text-align:center">Thank you, ${HER}</h2>
<svg id="chest" viewBox="0 0 240 210" aria-label="Golden chest">
<defs><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9e7a0"/><stop offset=".5" stop-color="#d9a52f"/><stop offset="1" stop-color="#8a5f10"/></linearGradient>
<linearGradient id="bm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff6b8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6b8" stop-opacity="0"/></linearGradient></defs>
<g class="beam"><path d="M60 98L-20 -60H260L180 98Z" fill="url(#bm)"/><ellipse cx="120" cy="98" rx="84" ry="9" fill="#fff6b8"/></g>
<rect x="34" y="96" width="172" height="90" rx="8" fill="url(#gc)" stroke="#6b4709" stroke-width="3"/>
<g fill="#6b4709" opacity=".55"><rect x="34" y="124" width="172" height="7"/><rect x="62" y="96" width="12" height="90"/><rect x="166" y="96" width="12" height="90"/></g>
<g fill="#3a2404"><circle cx="68" cy="110" r="2.6"/><circle cx="172" cy="110" r="2.6"/><circle cx="68" cy="172" r="2.6"/><circle cx="172" cy="172" r="2.6"/><rect x="106" y="110" width="28" height="34" rx="5"/></g>
<circle cx="120" cy="124" r="4.5" fill="#f9e7a0"/>
<g class="lid"><path d="M34 96V70Q34 28 120 28T206 70V96Z" fill="url(#gc)" stroke="#6b4709" stroke-width="3"/><g fill="#6b4709" opacity=".55"><rect x="62" y="44" width="12" height="52"/><rect x="166" y="44" width="12" height="52"/></g><rect x="108" y="82" width="24" height="14" rx="4" fill="#3a2404"/></g>
</svg>
<p class="cp">Something golden was waiting inside. Now let me get to know you, so I can plan this properly.</p>
<button class="next" id="go" style="opacity:0;pointer-events:none;transition:opacity 1s">Plan our evening</button></div>`,()=>{
setTimeout(()=>{$('#chest').classList.add('open');const r=$('#chest').getBoundingClientRect();spawn(r.left+r.width/2,r.top+r.height*.4,90,true);burst();chime()},900);
setTimeout(()=>{const g=$('#go');g.style.opacity=1;g.style.pointerEvents='auto'},2600);
$('#go').onclick=()=>ask(0)})}

const esc=t=>String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function ask(i){
if(i>=QS.length)return done();
const q=QS[i],pv=A[q.k]||{};
let h=`<div class="q"><div class="dots">${QS.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><div class="eb">Question ${i+1} of ${QS.length}</div><h2 style="text-align:center">${q.t}</h2>`;
if(q.o)h+=`<div class="opts">${q.o.map((o,j)=>`<button class="opt" style="animation-delay:${j*80}ms" data-v="${esc(o)}">${o}</button>`).join('')}</div>`;
if(q.sw)h+=`<div class="opts">${q.sw.map((c,j)=>`<button class="sw" style="background:${c};animation-delay:${j*70}ms" data-v="${q.names[j]}" data-c="${c}" aria-label="${q.names[j]}"></button>`).join('')}</div>`;
const ph=q.free?q.txt:'Or write it in your own words…';
h+=(q.free?`<textarea rows="3" id="tx" placeholder="${esc(ph)}">${esc(pv.t||'')}</textarea>`:`<input id="tx" placeholder="${esc(ph)}" value="${esc(pv.t||'')}">`);
h+=`<div class="nav">${i?'<button class="alt back" id="bk">Back</button>':'<span></span>'}<button class="next" id="nx">${i==QS.length-1?'Seal our date':'Continue'}</button></div></div>`;
show(h,()=>{
let sel=pv.o||null,selc=pv.c;
const bs=document.querySelectorAll('.opt,.sw');
bs.forEach(b=>{if(b.dataset.v===sel)b.classList.add('sel');b.onclick=()=>{bs.forEach(x=>x.classList.remove('sel'));if(sel===b.dataset.v){sel=null;selc=null}else{b.classList.add('sel');sel=b.dataset.v;selc=b.dataset.c;const r=b.getBoundingClientRect();spawn(r.left+r.width/2,r.top+r.height/2,12,true)}}});
$('#nx').onclick=()=>{const t=$('#tx').value.trim();
if(!sel&&!t&&!q.free){const c=$('.q');c.classList.remove('nudge');void c.offsetWidth;c.classList.add('nudge');$('#tx').focus();return}
const v=sel&&t?`${sel} (${t})`:(t||sel||'Surprise me');
A[q.k]={v,c:selc,o:sel,t};spawn(innerWidth/2,innerHeight/2,26,true);ask(i+1)};
const bk=$('#bk');if(bk)bk.onclick=()=>ask(i-1);
const tx=$('#tx');if(!q.free)tx.addEventListener('keydown',e=>{if(e.key==='Enter')$('#nx').click()})
})}

function summary(){
let s=`She said yes.\n${HER} and I have a date. Here is everything she picked:\n\n`;
for(const k in A)s+=`- ${k}: ${A[k].v}\n`;
return s+`\nSealed on ${new Date().toLocaleString()}`}

function done(){
const rows=Object.entries(A).map(([k,o])=>`<div class="row"><b>${k}</b><span>${o.c?`<i class="dot" style="background:${o.c}"></i>`:''}${o.v.replace(/</g,'&lt;')}</span></div>`).join('');
const txt=summary(),enc=encodeURIComponent(txt);
const wa=`https://wa.me/${PHONE}?text=${enc}`;
show(`<div class="ticket"><div class="eb">Official date covenant</div><h2>Our date is set</h2><div class="tag">Written for ${HER}</div>${rows}<div class="stamp">Sealed ${new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}</div></div>
<div class="share"><a class="btn" href="${wa}" target="_blank" rel="noopener">Send my answers</a>
${EMAIL?`<a class="btn alt" href="mailto:${EMAIL}?subject=${encodeURIComponent('She said yes')}&body=${enc}">Send by email</a>`:''}
<button class="alt" id="cp">Copy my answers</button></div>
<p class="hint">Take a screenshot of this ticket too. It's your proof.</p>`,()=>{
burst();setTimeout(burst,900);
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#cp').textContent='Copied'}catch(e){$('#cp').textContent='Select and copy from the ticket'}}})}

intro();
</script>
</body>
</html>
